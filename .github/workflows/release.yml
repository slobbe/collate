name: Release

on:
  push:
    tags:
      - "v[0-9]*"

permissions:
  actions: read
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Ensure tagged commit is on main
        run: |
          git fetch origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "${{ github.sha }}" "origin/main"; then
            echo "The release tag must point to a commit contained in main."
            exit 1
          fi

      - name: Require successful CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh run list \
            --repo "${{ github.repository }}" \
            --workflow ci.yml \
            --commit "${{ github.sha }}" \
            --status completed \
            --json conclusion \
            --jq 'any(.[]; .conclusion == "success")' | grep -qx true; then
            echo "A successful CI run for this commit is required before release."
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Release
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
